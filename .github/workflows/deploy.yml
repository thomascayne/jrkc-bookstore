name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize promotion
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Require an authorized merged pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            | node scripts/branch-policy.mjs deployment "$TARGET_BRANCH"

  quality:
    name: Revalidate release
    needs: authorize
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs:
      - authorize
      - quality
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      COMPOSE_PROJECT: jrkc-bookstore-production
      DEPLOYMENT_PATH: ${{ vars.ORACLE_DEPLOYMENT_PATH }}
      DEPLOY_ENV_FILE: .env.production
      HOST_PORT: 3100
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
    steps:
      - name: Check out authorized release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment configuration
        run: |
          test -n "$DEPLOYMENT_PATH"
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_KNOWN_HOSTS"
          test -n "$ORACLE_SSH_PRIVATE_KEY"
          test -n "$ORACLE_USER"
          case "$DEPLOYMENT_PATH" in
            /*) ;;
            *) echo "Oracle deployment path must be absolute." >&2; exit 1 ;;
          esac

      - name: Configure strict SSH identity
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/jrkc_oracle"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/jrkc_oracle" "$HOME/.ssh/known_hosts"

      - name: Deploy verified commit
        run: |
          remoteDeployScript="/tmp/jrkc-bookstore-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"

          cleanupRemoteDeployScript() {
            ssh \
              -i "$HOME/.ssh/jrkc_oracle" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$ORACLE_USER@$ORACLE_HOST" \
              rm -f -- "$remoteDeployScript"
          }

          trap cleanupRemoteDeployScript EXIT

          scp \
            -i "$HOME/.ssh/jrkc_oracle" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy/deploy-release.sh \
            "$ORACLE_USER@$ORACLE_HOST:$remoteDeployScript"

          ssh \
            -i "$HOME/.ssh/jrkc_oracle" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$ORACLE_USER@$ORACLE_HOST" \
            bash "$remoteDeployScript" \
              "$DEPLOYMENT_PATH" \
              "$GITHUB_SHA" \
              "$GITHUB_REF_NAME" \
              "$DEPLOY_ENV_FILE" \
              "$COMPOSE_PROJECT" \
              "$HOST_PORT"
