name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enforce pull-request direction
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: node scripts/branch-policy.mjs pull-request "$BASE_BRANCH" "$HEAD_BRANCH"

      - name: Test branch policy
        run: npm run test:branch-policy

      - name: Test catalog filter conversion
        run: npm run test:catalog-filters

      - name: Test deployment environment bootstrap
        run: sh scripts/deployment-environment.test.sh

      - name: Test deployment runtime verification
        run: npm run test:deployment-runtime

      - name: Test Stripe portfolio mode
        run: npm run test:stripe-mode

      - name: Test Docker resource isolation
        run: sh scripts/docker-isolation.test.sh

  validation:
    name: Validate application
    needs: branch-policy
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_PUBLIC_GOOGLE_BOOKS_API_KEY: ci-placeholder
      NEXT_PUBLIC_GOOGLE_BOOKS_API_URL: https://www.googleapis.com/books/v1/volumes
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      POSTGRES_OWNER_PASSWORD: ci-owner-placeholder
      POSTGRES_PASSWORD: ci-app-placeholder
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Validate Dockerfile
        run: docker build --check .

      - name: Validate Compose configuration
        run: |
          touch .env.production
          docker compose --env-file .env.production config --quiet
